<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small Trader Stock & Profit Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Stock & Profit Calculator</h1>
        
        <div class="form-container">
            <form id="trade-form">
                <div class="form-group">
                    <label for="stockName">Stock Name</label>
                    <input type="text" id="stockName" required placeholder="e.g., AAPL">
                </div>
                <div class="form-group">
                    <label for="buyPrice">Buy Price</label>
                    <input type="number" id="buyPrice" step="0.01" required min="0">
                </div>
                <div class="form-group">
                    <label for="sellPrice">Sell Price</label>
                    <input type="number" id="sellPrice" step="0.01" required min="0">
                </div>
                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" required min="1">
                </div>
                <button type="submit">Add Trade</button>
            </form>
        </div>

        <div class="summary">
            <h2>Total Profit / Loss: <span id="total-profit-loss">$0.00</span></h2>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Stock Name</th>
                        <th>Buy Price</th>
                        <th>Sell Price</th>
                        <th>Quantity</th>
                        <th>Profit/Loss</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="trade-list">
                    <!-- Trades will be populated here -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
